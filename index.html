<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>煮飯仔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="煮飯仔：揀場景、食材、幫手、煮法同廚具，按次序落鑊，睇下煮成點。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d2321">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+HK:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 灶台 (settings) | 鑊 (ordered pot, sticky) | 食材櫃 (sources) — stacks on phones. Each scene re-tints the page through --acc. */
:root{
  --bg:#eef1f0; --panel:#ffffff; --panel2:#f5f7f6; --ink:#1d2321; --muted:#5b6764; --line:#d2dad7; --mix:#000;
  --scrim:color-mix(in oklab,var(--bg) 30%,transparent);
  --flame:#e8622a; --on-acc:#ffffff; --shade:rgba(15,20,18,.5);
  --c-meat:#bf453b; --c-sea:#2c74b0; --c-veg:#3b8945; --c-starch:#ad8028; --c-egg:#c09311; --c-aro:#8752ad; --c-sau:#83573a; --c-liq:#22909b; --c-oil:#b48c18;
  --d-raw:#3b6dcf; --d-half:#28938f; --d-ok:#2e9449; --d-over:#cc7d24; --d-burnt:#4e3426;
  --acc:#b8821b;
  --f-disp:"LXGW WenKai TC","Noto Serif TC","PMingLiU",serif;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1a201e; --panel2:#212826; --ink:#e7edeb; --muted:#93a19d; --line:#2e3835; --mix:#fff; --shade:rgba(0,0,0,.62); --scrim:rgba(8,11,10,.45); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111614; --panel:#1a201e; --panel2:#212826; --ink:#e7edeb; --muted:#93a19d; --line:#2e3835; --mix:#fff; --shade:rgba(0,0,0,.62); --scrim:rgba(8,11,10,.45); color-scheme:dark}

body[data-scene="home"]{--acc:#b8821b}
body[data-scene="dorm"]{--acc:#1f968a}
body[data-scene="dpd"]{--acc:#cf3a2f}
body[data-scene="cha"]{--acc:#3a8a57}
body[data-scene="steak"]{--acc:#9a3045}
body[data-scene="french"]{--acc:#3554a4}
body[data-scene="wild"]{--acc:#6d7f26}
body{
  --acc-ink:color-mix(in oklab,var(--acc) 76%,var(--mix));
  --acc-soft:color-mix(in oklab,var(--acc) 13%,var(--panel));
  --scene-bg:color-mix(in oklab,var(--acc) 6%,var(--bg));
  margin:0; background:var(--scene-bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55; transition:background-color .4s;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--f-disp);font-weight:700;font-size:32px;letter-spacing:.06em;line-height:1}
.logo b{color:var(--acc-ink)}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-weight:700}
.bar{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.hp i{background:var(--d-ok)}
.bar.hp.low i{background:var(--c-meat)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--c-meat);color:var(--c-meat)}

nav.scenes{display:flex;gap:6px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:thin}
.scene-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.scene-tab .dot{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.scene-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.scenebg{position:fixed;inset:0;z-index:-1;background-color:var(--scene-bg);background-repeat:repeat;transition:background-color .4s}
.scenebg::after{content:"";position:absolute;inset:0;background:var(--scrim)}
.glass{background:color-mix(in oklab,var(--panel) 84%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
header.top.glass{margin-top:10px;padding-inline:14px}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 20px;align-items:end;padding:18px 18px 14px;margin-top:8px;border-bottom:3px solid var(--acc)}
.banner h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(32px,5.4vw,50px);line-height:1;margin:0;color:var(--acc-ink);letter-spacing:.04em}
.banner .tag{margin:0;color:var(--muted);font-size:14px}
.banner .note{margin:4px 0 0;font-size:13px}
.banner .note b{color:var(--acc-ink)}
.howto{grid-column:1/-1;font-size:13px;color:var(--muted)}
.howto summary{cursor:pointer;color:var(--ink);width:max-content}
.howto ol{margin:6px 0 0;padding-left:20px;max-width:70ch}
@media (max-width:620px){.banner{grid-template-columns:1fr}.stats{order:3;flex-basis:100%}}

main.grid{display:grid;gap:16px;padding-block:16px 32px;grid-template-columns:300px minmax(0,1fr) 370px;grid-template-areas:"setup pot pantry";align-items:start}
@media (max-width:1120px){main.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"setup pantry" "pot pot"}}
@media (max-width:720px){main.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"setup" "pantry" "pot"}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
#setup{grid-area:setup}#pot{grid-area:pot}#pantry{grid-area:pantry}
@media (min-width:1121px){#pot{position:sticky;top:12px}}
h2{font-family:var(--f-disp);font-weight:700;font-size:21px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.fields{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.lab{font-size:12px;color:var(--muted);letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline}
.lab b{color:var(--ink);letter-spacing:0;font-size:14px}
select{width:100%;font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 10px;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.chip:disabled{opacity:.32;cursor:not-allowed}
.fit{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:400}
.helpers{display:grid;gap:6px}
.helper{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px}
.helper b{display:block;font-size:14px}
.helper span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.helper[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
input[type=range]:disabled{opacity:.4}
.flames{display:flex;gap:3px;height:18px;align-items:end}
.flames i{flex:1;background:var(--line);border-radius:3px 3px 1px 1px}
.flames i.on{background:var(--flame)}
.rcard{border:1px dashed var(--acc);border-radius:9px;padding:10px 11px;font-size:13px;background:var(--acc-soft);display:grid;gap:6px}
.rcard .meta{color:var(--muted)}
.rcard .req{display:flex;flex-wrap:wrap;gap:4px}
.req span{border-radius:5px;padding:0 6px;background:var(--panel);border:1px solid var(--line);font-size:12px}
.req span.have{border-color:var(--d-ok);color:var(--d-ok);font-weight:700}

.src-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.src-tab{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:4px 11px;font-size:14px}
.src-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.src-desc{font-size:12px;color:var(--muted);margin:0 0 10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 7px;min-width:0}
.item:hover:not(:disabled){border-color:var(--acc)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item .t{min-width:0}
.item .nm{display:block;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.item .pr{display:block;font-size:11px;color:var(--muted);font-family:var(--f-num)}
.stamp{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;line-height:1;color:#fff;background:var(--cc)}
.c-meat{--cc:var(--c-meat)}.c-sea{--cc:var(--c-sea)}.c-veg{--cc:var(--c-veg)}.c-starch{--cc:var(--c-starch)}.c-egg{--cc:var(--c-egg)}.c-aro{--cc:var(--c-aro)}.c-sau{--cc:var(--c-sau)}.c-liq{--cc:var(--c-liq)}.c-oil{--cc:var(--c-oil)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--cc)}

.potlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;color:#fff;background:var(--bc);white-space:nowrap}
.b-raw{--bc:var(--d-raw)}.b-half{--bc:var(--d-half)}.b-ok{--bc:var(--d-ok)}.b-over{--bc:var(--d-over)}.b-burnt{--bc:var(--d-burnt)}.b-none{--bc:transparent;color:var(--muted)}
.mv{display:flex;gap:1px}
.stage-wrap{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:linear-gradient(var(--panel2),var(--panel));overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-height:190px}
.potlist{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:5px!important}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"g n x" "g b b";column-gap:5px;row-gap:2px;align-items:center;padding:5px 3px 4px 6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;min-width:0}
@media (pointer:fine){.prow{cursor:grab}}
.prow .grip{grid-area:g;position:relative;touch-action:none;display:block;border-radius:6px;cursor:grab}
.prow .grip .stamp{width:24px;height:24px;font-size:14px}
.prow .idx{position:absolute;left:-6px;top:-6px;font-style:normal;font-family:var(--f-num);font-size:9px;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 3px;line-height:13px}
.prow .nm{grid-area:n;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .x{grid-area:x;padding:0 4px;font-size:11px;align-self:start}
.prow .badge{grid-area:b;justify-self:start;font-size:10px;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.prow.dragging{z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.25);background:var(--acc-soft);border-color:var(--acc);cursor:grabbing}
.prow.drop-target{outline:2px dashed var(--acc);outline-offset:1px}
.sec{border-top:1px solid var(--line);padding-block:8px}
.sec:first-of-type{border-top:0;padding-top:0}
.sec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.1em}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸";margin-right:6px;transition:transform .15s;display:inline-block}
.sec[open] summary::before{transform:rotate(90deg)}
.sec summary span{flex:1}
.sec summary small{color:var(--acc-ink);font-weight:700;letter-spacing:0;font-size:13px}
.sec-body{display:grid;gap:8px;margin-top:8px}
.helpers{grid-template-columns:1fr 1fr}
.helper{padding:6px 8px}
.helper span{font-size:11px}
.stage-wrap.ctl{position:relative;height:clamp(160px,24vh,200px);margin-bottom:8px}
.stage-art{position:absolute;inset:0;display:flex;justify-content:center}
.stage-art .stage{height:100%}
.stage-art .stage svg{height:100%;width:auto;max-width:100%;max-height:none}
.st-wares{position:absolute;left:6px;top:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:36%;z-index:1}
.st-wares .chip{font-size:12px;padding:2px 7px;background:color-mix(in oklab,var(--panel) 90%,transparent)}
.st-wares .chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.st-wares .chip[aria-pressed="true"] .fit{color:var(--on-acc)}
.st-heat,.st-time{position:absolute;bottom:6px;width:min(31%,180px);background:color-mix(in oklab,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 8px 5px;z-index:1;display:grid;gap:2px}
.st-heat{left:6px}.st-time{right:6px}
.st-heat .lab,.st-time .lab{letter-spacing:.04em}
.st-heat b,.st-time b{font-size:13px}
.st-meth{position:absolute;right:6px;top:6px;z-index:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;max-width:36%}
.st-meth .chip{font-size:12px;padding:2px 8px;background:color-mix(in oklab,var(--panel) 90%,transparent)}
.st-meth .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wl{font-family:var(--f-num);font-size:9px;color:var(--c-starch);margin-left:1px}
.upchip{border-style:dashed!important;color:var(--acc-ink)}
.boost{display:flex;gap:8px;align-items:flex-start;border:1px dashed var(--line);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.boost.on{border-color:var(--c-starch);background:color-mix(in oklab,var(--c-starch) 12%,var(--panel));color:var(--ink)}
.boost input{margin-top:2px;accent-color:var(--c-starch)}
.boost b{display:block;color:var(--ink);font-size:13px}
.scene-tab.locked{opacity:.6}
.scene-tab small{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.shop{display:grid;gap:6px}
.shop-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2)}
.lvtag{font-size:11px;font-family:var(--f-num);color:var(--muted)}
.st-pred{position:absolute;right:6px;top:6px;z-index:1;font-size:12px;background:color-mix(in oklab,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.st-pred .g{width:20px;height:20px;border-radius:50%;border:2px solid var(--gc);color:var(--gc);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:12px}
.st-pred b{color:var(--ink)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:end;margin-top:10px}
@media (max-width:620px){.lower{grid-template-columns:1fr}.st-wares{max-width:62%}.st-meth{max-width:36%}.st-heat,.st-time{width:47%}.stage-wrap.ctl{height:270px}.stage-art{top:62px;bottom:62px}.prow{padding:5px 2px 4px 4px;column-gap:2px}.prow .nm{display:none}.prow{grid-template-areas:"g x" "b b";grid-template-columns:auto 1fr}}
.lower .flavor{margin-top:0}
.lower .tube{height:30px}
.lower .predict{margin:0;padding:0;border:0;flex-wrap:nowrap}
.cooking .stage-wrap{margin-bottom:12px}
.cooking .stage svg{max-height:200px}
.res-stage .stage svg{max-height:120px}
.food .drop{transition:transform .38s cubic-bezier(.3,1.5,.6,1),opacity .2s}
.food.pending .drop{opacity:0;transform:translateY(-70px)}
.food .fi{transform-box:fill-box;transform-origin:center}
.food.d-burnt rect{fill:#3a281e!important}
.food.d-over .fi{filter:brightness(.75) saturate(.8)}
.food.d-raw rect{opacity:.6}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .32s ease-in-out infinite alternate}
.fl:nth-child(3n){animation-duration:.27s}.fl:nth-child(3n+1){animation-duration:.41s}
@keyframes flick{from{transform:scaleY(.82) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.92)}}
.fx{opacity:0;transition:opacity .4s}
.live .fx{opacity:1}
.wisp{transform-box:fill-box;transform-origin:50% 100%;animation:wisp 2.2s ease-out infinite;opacity:0}
@keyframes wisp{0%{opacity:0;transform:translateY(10px) scaleX(.8)}30%{opacity:.75}100%{opacity:0;transform:translateY(-34px) scaleX(1.3)}}
.bub{transform-box:fill-box;transform-origin:center;animation:bub 1.1s ease-in infinite;opacity:0}
@keyframes bub{0%{opacity:0;transform:scale(.3)}50%{opacity:.9}100%{opacity:0;transform:scale(1.4) translateY(-6px)}}
.vessel{transform-box:view-box;transform-origin:160px 150px}
.live.m-stir .vessel{animation:rock .45s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateX(4px)}}
.live.m-stir .fi{animation:toss .9s ease-in-out infinite}
@keyframes toss{0%,55%,100%{transform:none}25%{transform:translateY(-28px) rotate(200deg)}}
.live.m-pan .fi,.live.m-fry .fi,.live.m-grill .fi{animation:sizzle .18s steps(2) infinite}
@keyframes sizzle{from{transform:translate(-.6px,.4px)}to{transform:translate(.6px,-.4px)}}
.live.m-boil .fi,.live.m-braise .fi,.live.m-steam .fi{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(1px)}to{transform:translateY(-4px) rotate(8deg)}}
.live.m-grill .fi{animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
.ovglow{animation:none}
.live .ovglow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.sticks{transform-box:view-box;transform-origin:160px 112px;opacity:0}
.live.m-raw .sticks{opacity:1;animation:stir 1.2s linear infinite}
@keyframes stir{0%{transform:translate(0,0)}25%{transform:translate(14px,4px)}50%{transform:translate(0,8px)}75%{transform:translate(-14px,4px)}100%{transform:translate(0,0)}}
.lid{transform-box:view-box;transform-origin:160px 60px}
.live.m-steam .lid{animation:lid .5s ease-in-out infinite alternate}
@keyframes lid{to{transform:translateY(-3px) rotate(1.5deg)}}
.mini{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:13px;line-height:1.3}
.mini:hover{background:var(--line);color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:26px 12px;text-align:center;color:var(--muted);font-size:14px}

function doneness(g,r,ctx,tolB){
  const prot=g.c==='meat'||g.c==='sea'||g.c==='egg';
  if(g.steak){
    let k=STH.findIndex(t=>r<t);if(k<0)k=7;const lab=SL[k];

    let f=base*.72+Math.min(1,D.u)*.14+Math.min(1,D.x)*.14;
    if(!sweet&&D.t>1.4){f-=.15;notes.push('偏甜');}

    if(D.x>=.9)notes.push('好香');

    const oh=match.opt.filter(x=>ids.has(x)).length;

  }else{

    let c=.25;if(cats.has('meat')||cats.has('sea')||cats.has('egg'))c+=.25;if(cats.has('veg'))c+=.15;if(cats.has('aro'))c+=.1;if(cats.has('starch'))c+=.05;
    let pr=0;PAIRS.forEach(([a,b])=>{if(ids.has(a)&&ids.has(b))pr++});c+=Math.min(.25,pr*.1);

    if(ids.size>9){c-=.05*(ids.size-9);notes.push('大雜燴');}

    if(chosen){const miss=chosen.req.filter(x=>!ids.has(x)).map(x=>ING[x].n);

  if(fit<.3&&n)add(`用${w.n}嚟${m.n}，有啲勉強`,'bad',0);

  const qi=items.filter(i=>i.g.c!=='sau');
  const avgQ=qi.length?avg(qi.map(i=>i.q)):1;

  const gr=GRADES.find(g=>score>=g[0]);

  const burnt=cooked.filter(i=>i.d.c==='burnt').length,rawN=cooked.filter(i=>i.d.c==='raw').length;

const SHORT={rice:'飯',noodle:'麵',hofun:'河',ricenoodle:'米粉',spaghetti:'意粉',macaroni:'通粉'};
function nameDish(items,mk){
  if(!items.length)return'空氣';
  const qty={};items.forEach(i=>qty[i.id]=(qty[i.id]||0)+1);
  const uniq=[];items.forEach(i=>{if(!uniq.find(u=>u.id===i.id))uniq.push(i)});
  const by=c=>uniq.filter(i=>c.includes(i.g.c)).sort((a,b)=>qty[b.id]-qty[a.id]);
  const prot=by(['meat','sea']),eggs=by(['egg']),vegs=by(['veg']),starch=by(['starch']);
  const solids=prot.concat(eggs,vegs,starch);
  if(!solids.length){const l=uniq.find(i=>i.g.c==='liq');return l?'清'+l.g.n:uniq[0].g.n+'汁';}
  const tagI=uniq.find(i=>i.g.tag&&i.g.c==='sau')||uniq.find(i=>i.g.tag&&i.g.c==='liq')||uniq.find(i=>i.g.tag);
  const tag=tagI?tagI.g.tag:'';
  const sI=starch.find(i=>SHORT[i.id]);
  const main=prot[0]||eggs[0]||vegs[0]||starch[0];
  const second=solids.find(i=>i!==main&&i!==sI&&i.g.c!=='meat'&&i.g.c!=='sea')||solids.find(i=>i!==main&&i!==sI);
  if(sI&&main!==sI&&(mk==='stir'||mk==='boil'||mk==='bake')){
    if(mk==='stir')return`${tag}${main.g.n}炒${SHORT[sI.id]}`;
    if(mk==='boil')return`${tag}${main.g.n}${sI.g.n}`;
    return`焗${tag}${main.g.n}${SHORT[sI.id]}`;
  }
  const mn=main.g.n,sn=second?second.g.n:'';
  switch(mk){
    case'stir':return sn?`${sn}炒${mn}`:`${tag||'清'}炒${mn}`;
    case'pan':return`${tag||'香'}煎${mn}`;
    case'fry':return`${tag||'酥'}炸${mn}`;
    case'boil':return items.some(i=>i.id==='water'||i.id==='stock')&&!tag?`${mn}${sn}湯`:`${tag||'清'}煮${mn}`;
    case'braise':return sn?`${sn}炆${mn}`:`${tag||'紅'}炆${mn}`;
    case'steam':return`${tag||'清'}蒸${mn}`;
    case'bake':return`${tag}焗${mn}`;
    case'grill':return`${tag||'炭'}燒${mn}`;
    default:return`涼拌${mn}`;
  }
}

function renderPantry(){
  const sk=S.scene,sc=SC[sk];
  let sid=S.src[sk];if(!sc.src.find(s=>s.id===sid))sid=S.src[sk]=sc.src[0].id;
  const src=sc.src.find(s=>s.id===sid);
  let list;
  if(src.stock){const st=S.stock[sk+'.'+src.id]||{};list=Object.keys(st).map(id=>({id,stock:st[id]}));}
  else if(src.wild)list=Object.keys(src.chance).map(id=>({id,chance:src.chance[id]}));
  else list=src.items.map(id=>({id}));
  const html=list.map(o=>{const g=ING[o.id];let pr;
    if(src.stock)pr=`剩 ${o.stock}`;else if(src.wild)pr=o.chance>=1?'免費':`成功率 ${Math.round(clamp(o.chance+(sel().helper==='coach'?(sel().boost?.5:.2):0),0,1)*100)}%`;
    else pr=g.p?'$'+Math.max(1,Math.round(g.p*src.mul)):'免費';
    return`<button class="item" data-act="add" data-v="${o.id}" ${src.stock&&!o.stock?'disabled':''}>${stamp(g)}<span class="t"><span class="nm">${g.n}</span><span class="pr">${pr}</span></span></button>`}).join('');

}

/* ================= 動作 ================= */
function addItem(id){
  if(S.pot.length>=14){toast('個鑊滿晒喇');return}
  const sk=S.scene,src=SC[sk].src.find(s=>s.id===S.src[sk]);const g=ING[id];
  const item={id,src:src.id,srcn:src.n,price:g.p?Math.max(1,Math.round(g.p*src.mul)):0,q:src.q};
  if(src.stock){const st=S.stock[sk+'.'+src.id];if(!st[id])return;st[id]--;item.lim=1;}
  if(src.wild){
    const c=src.chance[id];
    if(c<1){
      if(S.health<=2){toast('冇力喇，休息下先');return}
      S.health-=2;
      const se0=sel(),cb=se0.helper==='coach'?(se0.boost?.5:.2):0;const p=clamp(c+cb,0,1);
      if(Math.random()>=p){toast({streamfish:'條魚游走咗',rabbit:'陷阱空空如也',wildmush:'搵唔到菇'}[id]||'搵唔到');save();renderStats();return}
      item.lim=1;
      if(id==='wildmush'&&Math.random()<.3&&!(se0.helper==='coach'&&se0.boost))item.poison=1;
      if(se0.helper==='dog'&&Math.random()<(se0.boost?1:.3)&&S.pot.length<13){S.pot.push(Object.assign({},item));toast('狗仔幫你多搵咗一份'+g.n);}
    }
  }
  S.pot.push(item);save();renderSetup();renderPantry();renderPot();renderStats();
}
function removeItem(i){
  const p=S.pot[i];if(!p)return;
  if(p.lim&&!SC[S.scene].src.find(s=>s.id===p.src).wild){const st=S.stock[S.scene+'.'+p.src];if(st)st[p.id]=(st[p.id]||0)+1;}
  S.pot.splice(i,1);save();renderSetup();renderPantry();renderPot();
}
function clearPot(){for(let i=S.pot.length-1;i>=0;i--){const p=S.pot[i];if(p.lim&&!SC[S.scene].src.find(s=>s.id===p.src).wild){const st=S.stock[S.scene+'.'+p.src];if(st)st[p.id]=(st[p.id]||0)+1;}}S.pot=[];save();renderSetup();renderPantry();renderPot()}
function setMethod(k){const se=sel();se.method=k;if((WARE[se.ware].fit[k]||0)<.3)se.ware=bestWare(S.scene,k);const m=METH[k];se.time=m.t[2];se.heat=Math.min(m.h||1,wareCap(S.scene,se.ware))||1;}
function follow(){const se=sel(),r=RBY[se.recipe];if(!r)return;se.method=r.m;const w=r.w.find(x=>SC[S.scene].wares.includes(x));se.ware=w||bestWare(S.scene,r.m);
  if(r.m!=='raw'){se.heat=Math.min(r.h,wareCap(S.scene,se.ware));se.time=r.t;}save();renderSetup();renderPot();}
function switchScene(k){if(k===S.scene)return;if(!unlocked(k)){const u=UNLOCK[k];toast(`${SC[k].n}未開放：要名聲 ${u[0]}（而家 ${S.fame}）同廚藝 Lv${u[1]}（而家 Lv${level()}）`);return}clearPot();S.scene=k;save();renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function newDay(){S.day++;S.meal=0;S.health=clamp(S.health+8,0,100);restock();S.order=pick(ORDERS);}
function nextMeal(){S.meal++;if(S.meal>2)newDay();else S.order=pick(ORDERS);}
function checkHealth(msgs){if(S.health<=0){const fee=Math.min(S.money,400);S.money-=fee;S.health=60;S.day+=3;restock();msgs.push(`你暈低咗，入院三日，醫藥費 $${fee}。`);}}
function work(){
  if(S.health<15){toast('太攰喇，食番啲好嘢補下身先');return}
  const L=level(),pay=220+L*60+Math.min(200,S.fame*2);S.money+=pay;S.health=clamp(S.health-12,0,100);newDay();save();renderAll();toast(`打咗一日工，賺到 $${pay}`);
}

/* ---- 開煮 ---- */
let animTimer=null;
function cook(){
  if(!S.pot.length)return;
  const res=evaluate(true);
  const total=res.cost+res.boostCost;
  if(S.money<total){toast('唔夠錢');return}
  S.money-=total;
  CUR=res;CUR.photo=false;
  S.health=clamp(S.health-res.healthHit,0,100);S.fame+=res.fameHit;
  const sk=S.scene;S.pot=S.pot.filter(p=>!p.lim);
  const srcRisk=res.items.some(i=>i.src==='share');
  if(sk==='dorm'&&srcRisk&&Math.random()<.25){res.events.push({t:'宿友發現你「借用」咗佢啲嘢，喺群組度出你名',k:'bad',tm:res.T});S.fame-=4;}
  save();
  showCooking(res);
}
function timeline(res){
  const L=[];const verb={oil:'落{n}，熱{w}',aro:'落{n}，「嗞——」爆香',meat:'落{n}，滋滋聲',sea:'落{n}',egg:'落{n}',veg:'落{n}，兜勻',starch:'落{n}',liq:'注入{n}',sau:'加{n}'};
  res.items.forEach((it,k)=>L.push({tm:it.ti||0,t:(verb[it.g.c]||'落{n}').replace('{n}',it.g.n).replace('{w}',res.ware),k:'',f:k}));
  res.events.forEach(e=>L.push({tm:e.tm==null?res.T*.5:e.tm,t:e.t,k:e.k}));
  L.sort((a,b)=>a.tm-b.tm);
  L.push({tm:res.Teff,t:res.confiscated?'……':(res.method==='涼拌'?'拌勻上碟':'熄火，上碟'),k:''});
  return L;
}
function showCooking(res){
  const L=timeline(res);
  openSheet(`<div class="cooking"><div class="potart"><h3 style="margin:0">${res.method}緊……</h3><div class="src-desc" style="margin:0">${res.ware} · ${res.method==='涼拌'?'唔使開火':'火候 '+res.heat+' · '+fmtT(res.T)}</div></div>
  ${stageHTML({ware:sel().ware,method:sel().method,heat:res.heat,items:res.items,pfx:'ck',pending:true,live:true,id:'ckstage'})}
  <div class="prog"><i id="prog"></i></div><ol class="tl" id="tl"></ol>
  <div class="res-acts"><button class="btn" data-act="skip">跳過</button></div></div>`);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i=0;const tl=$('#tl'),pg=$('#prog');
  const step=()=>{if(i>=L.length){clearInterval(animTimer);
      res.items.forEach((it,k)=>{const f=document.getElementById('ckf'+k);if(f&&it.d)f.classList.add('d-'+it.d.c)});
      animTimer=setTimeout(()=>{const st=$('#ckstage');if(st)st.classList.remove('live');animTimer=setTimeout(()=>showResult(res),reduce?0:700)},reduce?0:900);return}
    const l=L[i];if(l.f!=null){const f=document.getElementById('ckf'+l.f);if(f)f.classList.remove('pending');}tl.insertAdjacentHTML('beforeend',`<li class="${l.k}"><time>${res.method==='涼拌'?'—':clock(l.tm)}</time><span>${esc(l.t)}</span></li>`);i++;pg.style.width=(i/L.length*100)+'%';};
  clearInterval(animTimer);
  if(reduce){while(i<L.length)step();step();}else animTimer=setInterval(step,380);
}

    <div class="quote">舍監：「再有下次就寫信俾你屋企。」</div><div class="res-acts"><button class="btn pri" data-act="toss">唉……</button></div>`);return;

    <h3>${esc(res.name)}</h3><div class="sub">${res.gname} · <span class="num">${res.score}</span> 分${res.match?' · 食譜「'+res.match.n+'」':' · 自創料理'}${isNew?' · 新發現':''}</div></div></div>
  <div class="bd">${rows}</div>
  ${dchips?`<div class="chiprow">${dchips}</div>`:''}

  ${res.notes.length?`<ul class="hints">${res.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
  <div class="quote">${esc(res.comment)}</div>
  <div class="res-acts">
   <button class="btn" data-act="eat">自己食<small>${res.grade==='S'||res.grade==='A'?'補身':res.grade==='E'?'有排肚痛':'頂肚'}</small></button>
   <button class="btn pri" data-act="serve">${sc.serve}<small>${sv}</small></button>
   <button class="btn" data-act="photo" id="btnPhoto">影相打卡<small>賺名聲</small></button>
   <button class="btn" data-act="toss">倒咗佢<small>當冇煮過</small></button>
  </div>`);
}
function serveValue(res){
  const sk=S.scene,sc=SC[sk],gm={S:2,A:1.5,B:1.1,C:.8,D:.4,E:0}[res.grade];
  if(sk==='home')return'名聲 '+sgn({S:4,A:3,B:2,C:1,D:0,E:-2}[res.grade]);
  if(sk==='wild')return'健康 '+sgn({S:12,A:9,B:6,C:3,D:0,E:-5}[res.grade]+(sel().helper==='hiker'?(res.boost?15:5):0));
  return'約 $'+salePrice(res);
}
function sgn(n){return(n>0?'+':'')+n}
function salePrice(res){
  const sc=SC[S.scene],hp=sel().helper,gm={S:2,A:1.5,B:1.1,C:.8,D:.4,E:0}[res.grade];
  let base=res.match&&res.match.p?Math.max(res.match.p,res.cost*sc.sell):res.cost*sc.sell+10;
  const bo=res.boost;
  let p=base*gm*(hp==='waiter'?(bo?1.6:1.25):1)*(hp==='boss'?1.1:1)*(hp==='somm'?(bo?2:1.4):1);
  if(hp==='barista'&&gm>0)p+=bo?40:15;
  return Math.round(p);
}
function resolve(kind){
  const res=CUR;if(!res)return;
  const msgs=[];const sk=S.scene,hp=sel().helper;
  if(kind==='photo'){
    if(res.photo)return;res.photo=true;
    const f={S:5,A:3,B:1,C:0,D:1,E:4}[res.grade]*(hp==='roomie'?(res.boost?3:2):1);S.fame+=f;
    const likes={S:'九百幾',A:'三百幾',B:'幾十',C:'兩三',D:'幾十個「哈哈」',E:'一千幾個「嬲嬲」，爆紅'}[res.grade];
    toast(`打卡收到 ${likes}${res.grade==='D'||res.grade==='E'?'':'個讚'}，名聲 ${sgn(f)}`);
    const b=$('#btnPhoto');if(b)b.disabled=true;save();renderStats();return;
  }
  if(kind==='eat'){
    let h={S:15,A:10,B:5,C:0,D:-5,E:-15}[res.grade];
    if(res.danger&&Math.random()<.55){h-=20;S.day++;restock();msgs.push('食咗未熟嘅嘢，肚痛到成日喺廁所，浪費咗一日。');}
    if(res.poison){h-=35;const fee=Math.min(S.money,150);S.money-=fee;S.day+=2;restock();msgs.push(`食咗毒菇，睇見滿天小人，睇醫生使咗 $${fee}，休息兩日。`);}
    S.health=clamp(S.health+h,0,100);
    if(!msgs.length)msgs.push(h>0?`食得好滿足，健康 ${sgn(h)}`:h<0?`食完唔係幾舒服，健康 ${h}`:'食飽咗。');
  }
  if(kind==='serve'){
    if(sk==='home'){const f={S:4,A:3,B:2,C:1,D:0,E:-2}[res.grade]+(hp==='auntie'?1:0);S.fame+=f;msgs.push(`屋企人食晒，名聲 ${sgn(f)}`);}
    else if(sk==='wild'){const h={S:12,A:9,B:6,C:3,D:0,E:-5}[res.grade]+(hp==='hiker'?(res.boost?15:5):0);S.health=clamp(S.health+h,0,100);const f={S:3,A:2,B:1,C:0,D:0,E:-1}[res.grade];S.fame+=f;
      if(res.poison){S.fame-=6;msgs.push('隊友食完中毒，要召直升機……名聲 −6');}else msgs.push(`同隊友分享，健康 ${sgn(h)}，名聲 ${sgn(f)}`);}
    else{const p=salePrice(res);S.money+=p;let f={S:5,A:3,B:1,C:0,D:-2,E:-4}[res.grade]+(hp==='boss'?(res.boost?5:2):0);
      if(hp==='chef'&&!res.boost&&res.score<70){f-=3;msgs.push('主廚當眾鬧咗你十分鐘。');}
      if(res.danger&&Math.random()<.4){f-=5;msgs.push('有客人食完肚痛，上網留咗負評。');}
      S.fame+=f;msgs.push(`收到 $${p}，名聲 ${sgn(f)}`);}
  }
  if(kind==='toss')msgs.push(res.confiscated?'冇得食，今餐捱餓。':'倒咗落垃圾桶。');
  // 記錄
  if(!res.confiscated){
    const c=S.codex[res.name];
    if(!c||res.score>c.s)S.codex[res.name]={s:res.score,g:res.grade,sc:S.scene,r:res.match?res.match.id:'',n:(c?c.n:0)+1};else c.n++;
  }
  const L0=level();S.exp+=res.confiscated?2:Math.round(res.score/6)+(res.match?3:0);const L1=level();
  if(L1>L0)msgs.push(`廚藝升到 Lv${L1}！`);
  SKEYS.forEach(k=>{if(unlocked(k)&&!(S.opened||[]).includes(k)){S.opened=(S.opened||[]).concat(k);if(UNLOCK[k][0]>0)msgs.push(`新場景開放：${SC[k].n}！`);}});
  nextMeal();checkHealth(msgs);
  CUR=null;save();closeSheet();renderAll();toast(msgs.join(' '));
}
function showShop(){
  const sc=SC[S.scene];
  const rows=sc.wares.map(w=>{const l=wlv(w),c=upCost(w),nx=WLV[l];
    return`<div class="shop-row"><div><b>${wn(w,l)}</b> <span class="lvtag">Lv${l}</span><div class="src-desc" style="margin:0">${l>1?`而家：熟度容錯 +${Math.round(WLV[l-1].t*100)}%、評分 +${WLV[l-1].b}${l>=3&&WARE[w].cap?'、火力上限 +1':''}`:'未升級'}</div>
    ${nx?`<div class="src-desc" style="margin:0">升級做 ${nx.n}：熟度容錯 +${Math.round(nx.t*100)}%、評分 +${nx.b}${l+1>=3&&WARE[w].cap?'、火力上限 +1':''}</div>`:''}</div>
    ${nx?`<button class="btn pri" data-act="buy" data-v="${w}" ${S.money>=c?'':'disabled'}>$${c}</button>`:'<span class="lvtag">已經頂級</span>'}</div>`}).join('');
  openSheet(`<h3>廚具升級</h3><p class="src-desc">錢包：<b class="num">$${Math.round(S.money).toLocaleString('en')}</b>。同一款廚具喺唔同場景共用等級。</p><div class="shop">${rows}</div>
  <div class="res-acts"><button class="btn" data-act="close">關閉</button></div>`);
}
function buyUp(w){const c=upCost(w);if(!c||S.money<c){toast('唔夠錢');return}S.money-=c;S.wareLv[w]=wlv(w)+1;save();renderStats();renderPot();showShop();toast(`升級咗做 ${wn(w,wlv(w))}！`);}
function openSheet(html){$('#sheet').innerHTML=html;$('#ov').hidden=false;const b=$('#sheet .btn');if(b)b.focus({preventScroll:true});}
function closeSheet(){$('#ov').hidden=true;$('#sheet').innerHTML='';}
function showCodex(){
  const secs=SKEYS.map(k=>{const rs=RECIPES.filter(r=>r.s===k);
    const known=rs.map(r=>{const c=S.codex[r.n];return c?`<div class="cx"><span>${r.n}</span><b>${c.g}</b></div>`:`<div class="cx unk"><span>？？？</span><span>${METH[r.m].n}</span></div>`}).join('');
    const own=Object.entries(S.codex).filter(([n,c])=>c.sc===k&&!c.r).sort((a,b)=>b[1].s-a[1].s).slice(0,8).map(([n,c])=>`<div class="cx"><span>${esc(n)}</span><b>${c.g}</b></div>`).join('');
    return`<div class="codex-sec" style="--sc:${SCOL[k]}"><h4>${SC[k].n}</h4><div class="codex-list">${known}${own}</div></div>`}).join('');
  const total=RECIPES.length,got=RECIPES.filter(r=>S.codex[r.n]).length,own=Object.values(S.codex).filter(c=>!c.r).length;
  openSheet(`<h3>食譜圖鑑</h3><p class="src-desc">食譜 ${got}/${total} · 自創料理 ${own} 款。問號嘅食譜可以喺灶台嘅食譜選單度睇提示。</p>${secs}
  <div class="res-acts"><button class="btn" data-act="close">關閉</button></div>`);
}
let resetArmed=false,resetTimer;
function reset(){
  const b=$('#btnReset');
  if(!resetArmed){resetArmed=true;b.textContent='再撳一下確認';b.classList.add('warn');resetTimer=setTimeout(()=>{resetArmed=false;b.textContent='重新開始';b.classList.remove('warn')},3500);return}
  clearTimeout(resetTimer);resetArmed=false;b.textContent='重新開始';b.classList.remove('warn');
  S=newState();restock();save();renderAll();toast('重新開始，第一日');
}

function init(){
  narrowMQ?.addEventListener?.('change',applyBG);
  S=load()||newState();
  S.wareLv=S.wareLv||{};S.opened=S.opened||SKEYS.filter(k=>unlocked(k));if(!unlocked(S.scene))S.scene='home';
  if(!Object.keys(S.stock).length)restock();
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act,v=b.dataset.v,se=sel();
    switch(a){
      case'scene':switchScene(v);break;
      case'src':S.src[S.scene]=v;save();renderPantry();break;
      case'add':addItem(v);break;
      case'rm':removeItem(+v);break;
      case'method':setMethod(v);save();renderPot();break;
      case'shop':showShop();break;
      case'buy':buyUp(v);break;
      case'ware':se.ware=v;se.heat=Math.min(se.heat,wareCap(S.scene,v))||1;save();renderPot();break;
      case'helper':if(se.helper!==v)se.boost=false;se.helper=v;save();renderSetup();renderPantry();renderPot();break;
      case'follow':follow();break;
      case'clear':clearPot();break;
      case'cook':cook();break;
      case'skip':clearInterval(animTimer);clearTimeout(animTimer);showResult(CUR);break;
      case'eat':case'serve':case'photo':case'toss':resolve(a);break;
      case'work':work();break;
      case'codex':showCodex();break;
      case'close':closeSheet();break;
      case'reset':reset();break;
    }
  });
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const row=e.target.closest('.prow');if(!row||e.button>0||e.target.closest('[data-act]'))return;
    if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
    const list=row.parentElement,rows=[...list.children],i=rows.indexOf(row);
    drag={row,rows,rects:rows.map(r=>r.getBoundingClientRect()),i,x0:e.clientX,y0:e.clientY,t:i,id:e.pointerId,moved:false};
    try{row.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!drag.moved){if(Math.hypot(dx,dy)<4)return;drag.moved=true;drag.row.classList.add('dragging');}
    drag.row.style.transform=`translate(${dx}px,${dy}px)`;
    const px=e.clientX,py=e.clientY;
    let t=drag.rects.findIndex(r=>px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom);
    if(t<0){let best=1e9;drag.rects.forEach((r,j)=>{const d=Math.hypot(px-(r.left+r.width/2),py-(r.top+r.height/2));if(d<best){best=d;t=j}});}
    drag.t=t;drag.rows.forEach((r,j)=>r.classList.toggle('drop-target',j===t&&j!==drag.i));
  });
  const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const{i,t,moved}=drag;drag=null;
    if(moved&&t!==i){const[it]=S.pot.splice(i,1);S.pot.splice(t,0,it);save();}renderPot(true);};
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
  document.addEventListener('keydown',e=>{
    const g=e.target.closest&&e.target.closest('.grip');if(!g)return;
    const i=+g.dataset.grip,d={ArrowUp:-1,ArrowLeft:-1,ArrowDown:1,ArrowRight:1}[e.key];if(!d)return;
    const t=i+d;if(t<0||t>=S.pot.length)return;e.preventDefault();
    [S.pot[i],S.pot[t]]=[S.pot[t],S.pot[i]];save();renderPot(true);const ng=document.querySelector(`[data-grip="${t}"]`);if(ng)ng.focus();
  });
  document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sec){S.ui=S.ui||{};S.ui[d.dataset.sec]=d.open;save();const sm=d.querySelector('summary');}},true);
  document.addEventListener('change',e=>{if(e.target.id==='selRecipe'){sel().recipe=e.target.value;save();renderSetup();renderPot();}
    if(e.target.id==='boost'){sel().boost=e.target.checked;save();renderSetup();renderPantry();renderPot();}});
  document.addEventListener('input',e=>{
    const se=sel();
    if(e.target.id==='heat'){se.heat=+e.target.value;$('#heatV').textContent=se.heat+' / '+wareCap(S.scene,se.ware);save();renderPot(true);}
    if(e.target.id==='time'){se.time=+e.target.value;$('#timeV').textContent=fmtT(se.time);save();renderPot(true);}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden&&!CUR)closeSheet();});
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!CUR)closeSheet();});
  renderAll();
}
if(!globalThis.NODE_TEST)init();
</script>
</body>
</html>
