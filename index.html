<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>煮飯仔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="煮飯仔：揀場景、食材、幫手、煮法同廚具，按次序落鑊，睇下煮成點。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d2321">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+HK:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 灶台 (settings) | 鑊 (ordered pot, sticky) | 食材櫃 (sources) — stacks on phones. Each scene re-tints the page through --acc. */
:root{
  --bg:#eef1f0; --panel:#ffffff; --panel2:#f5f7f6; --ink:#1d2321; --muted:#5b6764; --line:#d2dad7; --mix:#000;
  --flame:#e8622a; --on-acc:#ffffff; --shade:rgba(15,20,18,.5);
  --c-meat:#bf453b; --c-sea:#2c74b0; --c-veg:#3b8945; --c-starch:#ad8028; --c-egg:#c09311; --c-aro:#8752ad; --c-sau:#83573a; --c-liq:#22909b; --c-oil:#b48c18;
  --d-raw:#3b6dcf; --d-half:#28938f; --d-ok:#2e9449; --d-over:#cc7d24; --d-burnt:#4e3426;
  --acc:#b8821b;
  --f-disp:"LXGW WenKai TC","Noto Serif TC","PMingLiU",serif;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1a201e; --panel2:#212826; --ink:#e7edeb; --muted:#93a19d; --line:#2e3835; --mix:#fff; --shade:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111614; --panel:#1a201e; --panel2:#212826; --ink:#e7edeb; --muted:#93a19d; --line:#2e3835; --mix:#fff; --shade:rgba(0,0,0,.62); color-scheme:dark}

body[data-scene="home"]{--acc:#b8821b}
body[data-scene="dorm"]{--acc:#1f968a}
body[data-scene="dpd"]{--acc:#cf3a2f}
body[data-scene="cha"]{--acc:#3a8a57}
body[data-scene="steak"]{--acc:#9a3045}
body[data-scene="french"]{--acc:#3554a4}
body[data-scene="wild"]{--acc:#6d7f26}
body{
  --acc-ink:color-mix(in oklab,var(--acc) 76%,var(--mix));
  --acc-soft:color-mix(in oklab,var(--acc) 13%,var(--panel));
  --scene-bg:color-mix(in oklab,var(--acc) 6%,var(--bg));
  margin:0; background:var(--scene-bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55; transition:background-color .4s;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--f-disp);font-weight:700;font-size:32px;letter-spacing:.06em;line-height:1}
.logo b{color:var(--acc-ink)}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-weight:700}
.bar{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.hp i{background:var(--d-ok)}
.bar.hp.low i{background:var(--c-meat)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--c-meat);color:var(--c-meat)}

nav.scenes{display:flex;gap:6px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:thin}
.scene-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.scene-tab .dot{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.scene-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 20px;align-items:end;padding-block:18px 14px;border-bottom:2px solid var(--acc)}
.banner h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(32px,5.4vw,50px);line-height:1;margin:0;color:var(--acc-ink);letter-spacing:.04em}
.banner .tag{margin:0;color:var(--muted);font-size:14px}
.banner .note{margin:4px 0 0;font-size:13px}
.banner .note b{color:var(--acc-ink)}
.howto{grid-column:1/-1;font-size:13px;color:var(--muted)}
.howto summary{cursor:pointer;color:var(--ink);width:max-content}
.howto ol{margin:6px 0 0;padding-left:20px;max-width:70ch}
@media (max-width:620px){.banner{grid-template-columns:1fr}.stats{order:3;flex-basis:100%}}

main.grid{display:grid;gap:16px;padding-block:16px 32px;grid-template-columns:300px minmax(0,1fr) 370px;grid-template-areas:"setup pot pantry";align-items:start}
@media (max-width:1120px){main.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"setup pantry" "pot pot"}}
@media (max-width:720px){main.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"setup" "pantry" "pot"}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
#setup{grid-area:setup}#pot{grid-area:pot}#pantry{grid-area:pantry}
@media (min-width:1121px){#pot{position:sticky;top:12px}}
h2{font-family:var(--f-disp);font-weight:700;font-size:21px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.fields{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.lab{font-size:12px;color:var(--muted);letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline}
.lab b{color:var(--ink);letter-spacing:0;font-size:14px}
select{width:100%;font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 10px;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.chip:disabled{opacity:.32;cursor:not-allowed}
.fit{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:400}
.helpers{display:grid;gap:6px}
.helper{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px}
.helper b{display:block;font-size:14px}
.helper span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.helper[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
input[type=range]:disabled{opacity:.4}
.flames{display:flex;gap:3px;height:18px;align-items:end}
.flames i{flex:1;background:var(--line);border-radius:3px 3px 1px 1px}
.flames i.on{background:var(--flame)}
.rcard{border:1px dashed var(--acc);border-radius:9px;padding:10px 11px;font-size:13px;background:var(--acc-soft);display:grid;gap:6px}
.rcard .meta{color:var(--muted)}
.rcard .req{display:flex;flex-wrap:wrap;gap:4px}
.req span{border-radius:5px;padding:0 6px;background:var(--panel);border:1px solid var(--line);font-size:12px}
.req span.have{border-color:var(--d-ok);color:var(--d-ok);font-weight:700}

.src-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.src-tab{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:4px 11px;font-size:14px}
.src-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.src-desc{font-size:12px;color:var(--muted);margin:0 0 10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 7px;min-width:0}
.item:hover:not(:disabled){border-color:var(--acc)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item .t{min-width:0}
.item .nm{display:block;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.item .pr{display:block;font-size:11px;color:var(--muted);font-family:var(--f-num)}
.stamp{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;line-height:1;color:#fff;background:var(--cc)}
.c-meat{--cc:var(--c-meat)}.c-sea{--cc:var(--c-sea)}.c-veg{--cc:var(--c-veg)}.c-starch{--cc:var(--c-starch)}.c-egg{--cc:var(--c-egg)}.c-aro{--cc:var(--c-aro)}.c-sau{--cc:var(--c-sau)}.c-liq{--cc:var(--c-liq)}.c-oil{--cc:var(--c-oil)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--cc)}

.potlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.prow{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;background:var(--panel2)}
.prow .idx{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.prow .nm{font-size:14px;line-height:1.25;min-width:0}
.prow .nm small{display:block;font-size:11px;color:var(--muted)}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;color:#fff;background:var(--bc);white-space:nowrap}
.b-raw{--bc:var(--d-raw)}.b-half{--bc:var(--d-half)}.b-ok{--bc:var(--d-ok)}.b-over{--bc:var(--d-over)}.b-burnt{--bc:var(--d-burnt)}.b-none{--bc:transparent;color:var(--muted)}
.mv{display:flex;gap:1px}
.mini{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:13px;line-height:1.3}
.mini:hover{background:var(--line);color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:26px 12px;text-align:center;color:var(--muted);font-size:14px}
.potmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.potmeta b{color:var(--ink)}
.flavor{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.fl{display:grid;gap:3px;text-align:center;font-size:12px;color:var(--muted)}
.tube{height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;position:relative;overflow:hidden}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);opacity:.75}
.tube .ideal{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink);opacity:.35}
.predict{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.predict .p{font-size:13px;color:var(--muted)}
.predict .p b{font-size:18px;color:var(--ink);font-family:var(--f-disp)}
.cookbtn{font-family:var(--f-disp);font-size:20px;padding:9px 26px;letter-spacing:.1em}
.hints{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.hints li{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--panel2);border:1px solid var(--line)}
.hints li.bad{border-color:var(--c-meat);color:var(--c-meat)}
.hints li.good{border-color:var(--d-ok);color:var(--d-ok)}

.overlay{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:50;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:14px;width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;border:1px solid var(--line)}
.sheet h3{font-family:var(--f-disp);font-size:24px;margin:0 0 10px}
.cooking .potart{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.wokart{width:64px;height:64px;flex:0 0 auto}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--flame);transition:width .3s}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px}
.tl li{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;animation:fadein .25s}
.tl time{font-family:var(--f-num);color:var(--muted);font-size:12px;padding-top:2px}
.tl li.bad span{color:var(--c-meat)}
.tl li.good span{color:var(--d-ok)}
@keyframes fadein{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
.res-head{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.grade{flex:0 0 auto;width:86px;height:86px;border-radius:50%;border:3px solid var(--gc);color:var(--gc);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:42px;line-height:1;transform:rotate(-9deg)}
.res-head h3{margin:0;font-size:clamp(22px,4.6vw,30px);text-wrap:balance}
.res-head .sub{color:var(--muted);font-size:14px}
.bd{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:5px 10px;align-items:center;font-size:13px;margin:12px 0}
.bd .bar{width:100%;height:8px}
.bd .val{text-align:right;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.dchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.dchip .stamp{width:18px;height:18px;font-size:11px;border-radius:50%}
.evs{list-style:none;padding:0;margin:8px 0;display:grid;gap:3px;font-size:14px}
.evs li.good::before{content:"＋ ";color:var(--d-ok)}
.evs li.bad::before{content:"－ ";color:var(--c-meat)}
.evs li.info::before{content:"· ";color:var(--muted)}
.quote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0;font-family:var(--f-disp);font-size:17px}
.res-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.res-acts .btn{flex:1 1 130px;padding:9px 10px}
.res-acts small{display:block;font-size:11px;font-weight:400;opacity:.85}
.codex-sec{margin-bottom:16px}
.codex-sec h4{margin:0 0 6px;font-family:var(--f-disp);font-size:18px;color:var(--sc)}
.codex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.cx{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;display:flex;justify-content:space-between;gap:6px;background:var(--panel2)}
.cx.unk{color:var(--muted);border-style:dashed;background:transparent}
.cx b{font-family:var(--f-disp)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer{color:var(--muted);font-size:12px;padding-block:0 28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-scene="home">
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">煮<b>飯</b>仔</span><small>七個灶頭 · 料理模擬</small></div>
    <div class="stats" id="stats"></div>
    <div class="acts">
      <button class="btn" data-act="work" id="btnWork">去打工</button>
      <button class="btn" data-act="codex">食譜圖鑑</button>
      <button class="btn" data-act="reset" id="btnReset">重新開始</button>
    </div>
  </header>
  <nav class="scenes" id="scenes" aria-label="場景"></nav>
  <section class="banner" id="banner"></section>
  <main class="grid">
    <section class="panel" id="setup" aria-label="灶台設定"></section>
    <section class="panel" id="pantry" aria-label="食材"></section>
    <section class="panel" id="pot" aria-label="落鑊次序"></section>
  </main>
  <footer>進度會儲存喺呢部機嘅瀏覽器。煮飯仔 · fiveathree</footer>
</div>
<div class="overlay" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ================= 資料 ================= */
const MEALS=['早餐','午餐','晚餐'];
const FLK=['s','t','a','h','u','x','f'];
const FLN={s:'鹹',t:'甜',a:'酸',h:'辣',u:'鮮',x:'香',f:'油'};
const CATN={meat:'肉',sea:'海鮮',egg:'蛋奶',veg:'蔬菜',starch:'澱粉',aro:'香料',liq:'湯水酒',sau:'調味',oil:'油'};
const BULK=['meat','sea','egg','veg','starch'];
const ING={};
function I(id,n,c,st,ck,raw,p,fl,o){ING[id]=Object.assign({id,n,c,st,ck,raw,p,fl:fl||{}},o||{});}
// 油
I('oil','生油','oil',0,0,1,3,{f:1},{ch:'油'});
I('butter','牛油','oil',0,0,1,8,{f:1.1,x:.6},{tag:'牛油'});
I('lard','豬油','oil',0,0,1,4,{f:1.1,x:.8});
I('olive','橄欖油','oil',0,0,1,10,{f:.9,x:.3},{ch:'欖'});
// 香料
I('garlic','蒜頭','aro',1,1.5,1,3,{x:1.2},{tol:4,tag:'蒜蓉'});
I('ginger','薑','aro',1,1.5,1,3,{x:.8,h:.2},{tol:4});
I('scallion','蔥段','aro',1,1.5,1,3,{x:.8},{tol:3});
I('shallot','乾蔥','aro',1,1.5,1,4,{x:1,t:.2},{tol:4});
I('chili','辣椒','aro',1,1.5,1,3,{h:1.2},{tol:3});
I('wildonion','野蔥','aro',1,1.5,1,0,{x:.7},{tol:3});
I('rosemary','迷迭香','aro',4,0,1,12,{x:1},{ch:'迷'});
I('thyme','百里香','aro',4,0,1,12,{x:.9},{ch:'百'});
I('herbs','野生香草','aro',4,0,1,0,{x:.8},{ch:'草'});
I('parsley','番茜','aro',6,0,1,6,{x:.5},{ch:'茜'});
I('coriander','芫荽','aro',6,0,1,4,{x:.6});
I('scallion2','蔥花','aro',6,0,1,3,{x:.6},{ch:'蔥'});
// 肉

const KEY='cookrice.v1';

function newState(){
  const s={day:1,meal:0,money:600,fame:0,exp:0,health:100,scene:'home',codex:{},stock:{},order:pick(ORDERS),pot:[],sel:{},src:{}};
  return s;

function restock(){
  SKEYS.forEach(k=>SC[k].src.forEach(src=>{
    if(!src.stock)return;
    const st={};
    if(src.fixed)Object.assign(st,src.fixed);
    else{const n=src.risky?4:5;for(let i=0;i<n;i++){const id=pick(src.pool);st[id]=(st[id]||0)+1;}}
    S.stock[k+'.'+src.id]=st;
  }));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){const s=JSON.parse(t);if(s&&s.day){return Object.assign(newState(),s);}}}catch(e){}
  return null;
}
function level(){let L=1;while(S.exp>=30*L*(L+1))L++;return L}
function lvNeed(L){return 30*L*(L+1)}
function sel(){return S.sel[S.scene]||(S.sel[S.scene]=defaultSel(S.scene))}
function defaultSel(k){

function bestWare(k,m){let best=SC[k].wares[0],bf=-1;SC[k].wares.forEach(w=>{const f=WARE[w].fit[m]||0;if(f>bf){bf=f;best=w}});return best}
function wareCap(k,w){return Math.min(SC[k].heat,WARE[w].cap)}
function methodOK(k,m){return SC[k].wares.some(w=>(WARE[w].fit[m]||0)>=.3)}

/* ================= 計算 ================= */
function doneness(g,r,ctx,tolB){
  const prot=g.c==='meat'||g.c==='sea'||g.c==='egg';
  if(g.steak){
    let k=STH.findIndex(t=>r<t);if(k<0)k=7;const lab=SL[k];
    if(k===0)return{k:lab,q:.2,c:'raw',danger:!g.raw};
    if(k===6)return{k:lab,q:.4,c:'over'};
    if(k===7)return{k:lab,q:0,c:'burnt'};
    if(ctx.order){const t=SL.indexOf(ctx.order);const df=Math.abs(k-t);
      const q=df===0?1:df===1?(ctx.sous?.9:.75):df===2?.5:.3;
      return{k:lab,q,c:df===0?'ok':df===1?'half':'over',miss:df>0};}
    return{k:lab,q:(k===1||k===5)?.78:1,c:(k===1||k===5)?'half':'ok'};
  }
  const tol=(g.tol||1)*(1+tolB);
  if(ctx.raw)return g.raw?{k:'生食',q:1,c:'ok'}:{k:'生',q:.05,c:'raw',danger:prot};
  if(r<.5)return g.raw?{k:'生',q:.7,c:'raw'}:{k:'生',q:.05,c:'raw',danger:prot};
  if(r<.8)return g.raw?{k:'半生',q:.88,c:'half'}:{k:'半生',q:.45,c:'half',danger:prot};
  if(r<=1.6*tol)return{k:'啱啱好',q:1,c:'ok'};
  if(ctx.liq)return tol>=2?{k:'炆腍',q:.9,c:'ok'}:(r<=2.6*tol?{k:'過火',q:.6,c:'over'}:{k:'煮爛',q:.4,c:'over'});
  if(r<=2.6*tol)return{k:'過火',q:.55,c:'over'};
  return{k:'燶',q:0,c:'burnt'};
}
function evaluate(rand){
  const sk=S.scene,sc=SC[sk],se=sel(),mk=se.method,m=METH[mk],wk=se.ware,w=WARE[wk],hp=se.helper;
  const R=rand?Math.random:()=>1;
  const ev=[];const add=(t,k,tm)=>ev.push({t,k,tm});
  let items=S.pot.map((p,i)=>Object.assign({},p,{g:ING[p.id]}));
  let bonus=0,healthHit=0,fameHit=0;
  if(hp==='bro'&&R()<.25){const ix=items.findIndex(x=>x.g.c==='meat'||x.g.c==='sea');if(ix>=0){add(`細佬趁你轉身偷食咗一舊${items[ix].g.n}`,'bad');items.splice(ix,1);}}
  let heat=mk==='raw'?0:(w.fixed||se.heat);const T=mk==='raw'?0:se.time;let Teff=T;
  if(wk==='campfire'&&hp!=='hiker'&&rand){const d=Math.round(Math.random()*4-2);if(d){heat=clamp(heat+d,1,8);add(d>0?`營火突然旺咗，實際火候變 ${heat}`:`營火弱咗落嚟，實際火候變 ${heat}`,'info',T*.3);}}
  if(sk==='wild'&&mk!=='raw'&&R()<.15){Teff=T*.65;add('落雨！火勢弱晒','bad',Teff);}
  if(sk==='dorm'&&wk==='ihpan'&&heat>=6&&R()<.35){Teff=Math.min(Teff,T*(.4+Math.random()*.4));add('啪！跳掣，成層樓黑晒','bad',Teff);}
  let confiscated=false;
  if(sk==='dorm'&&(mk==='fry'||mk==='grill')&&R()<.5){confiscated=true;add('舍監聞到味衝入嚟，全部沒收！','bad',T*.5);fameHit-=5;}
  const hasOil=items.some(i=>i.g.c==='oil'||i.g.fat),oilN=items.filter(i=>i.g.c==='oil').length,hasLiq=items.some(i=>i.g.c==='liq');
  let doneMul=1,toolPen=0,burnAll=false;
  if(sk==='home'&&mk==='fry'&&R()<.4){add('滾油彈到手，痛到彈起','bad',0);healthHit+=5;}
  if(sk==='dpd'&&(mk==='stir'||mk==='fry')&&heat>=9&&oilN>=1&&R()<.18){
    if(hp==='wokmaster'){add('鑊邊起火！師傅順勢嚟個火焰秀，全場拍手','good',T*.4);bonus+=3;fameHit+=2;}
    else{add('鑊邊起火！手忙腳亂撲熄咗','bad',T*.4);doneMul*=.7;healthHit+=8;}
  }
  if(items.length){
    if(m.oil&&!hasOil){add('冇落油，黐晒底','bad',0);doneMul*=.75;toolPen+=.25;}
    if(mk==='fry'&&hasOil&&oilN<2){add('油唔夠浸，炸得唔均勻','bad',0);doneMul*=.85;}
    if(m.liq&&!hasLiq){add('冇落水，煲乾燶底','bad',T*.7);burnAll=true;toolPen+=.4;}
  }
  let poison=false;
  if(items.some(i=>i.poison)){
    if(hp==='coach'){add('教練一眼認出毒菇，幫你揀走咗','good',0);items=items.filter(i=>!i.poison);}
    else poison=true;
  }
  const lv=level();
  const tolB=(hp==='nerd'||hp==='sous'?.25:0)+(hp==='wokmaster'?.1:0)+.02*(lv-1);
  const rate=heat?Math.pow(heat/5,1.25)*m.mult:0;
  const n=items.length;
  const ctx={raw:mk==='raw',liq:(!!m.liq&&hasLiq)||mk==='steam',order:sk==='steak'?S.order:null,sous:hp==='sous'};
  items.forEach((it,i)=>{
    it.ti=n>1?T*m.spread*i/(n-1):0;
    if(!it.g.ck&&!ctx.raw){it.d=null;return}
    if(ctx.raw&&!it.g.ck&&it.g.c!=='veg'){it.d=null;return}
    const ex=Math.max(0,Teff-it.ti)*rate;const r=it.g.ck?ex/it.g.ck:0;it.r=r;
    let d=doneness(it.g,r,ctx,tolB);
    if(burnAll&&r>.5)d={k:'燶',q:0,c:'burnt'};
    it.d=d;
  });
  const cooked=items.filter(i=>i.d);
  const doneS=(cooked.length?avg(cooked.map(i=>i.d.q)):.6)*doneMul;
  const danger=cooked.some(i=>i.d.danger);
  const steakMiss=cooked.some(i=>i.d.miss);
  // 次序
  let orderG=1;
  if(n>1){let s=0,p=0;for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){p++;const df=items[a].g.st-items[b].g.st;if(df>0)s+=df>=2?1:.4;}orderG=clamp(1-2*s/p,0,1);}
  // 食譜
  const ids=new Set(items.map(i=>i.id));
  const chosen=RBY[se.recipe]||null;
  let match=null;
  const cands=RECIPES.filter(r=>r!==chosen).sort((a,b)=>b.req.length-a.req.length);
  if(chosen)cands.unshift(chosen);
  for(const r of cands){if(r.m===mk&&r.req.every(x=>ids.has(x))){match=r;break}}
  let orderS=orderG;
  if(match){const pos={};items.forEach((it,i)=>{if(pos[it.id]==null)pos[it.id]=i});const sq=match.seq.filter(x=>pos[x]!=null);let ok=0,pp=0;
    for(let a=0;a<sq.length;a++)for(let b=a+1;b<sq.length;b++){pp++;if(pos[sq[a]]<pos[sq[b]])ok++;}
    orderS=.4*orderG+.6*(pp?ok/pp:1);}
  // 味道
  const notes=[];
  const F={};FLK.forEach(k=>F[k]=0);items.forEach(i=>{for(const k in i.g.fl)F[k]+=i.g.fl[k]});
  let bulk=0;items.forEach(i=>{const c=i.g.c;if(BULK.includes(c))bulk+=1;else if(i.id==='water'||i.id==='stock')bulk+=.5;else if(c==='liq')bulk+=.3;});
  const D={};FLK.forEach(k=>D[k]=bulk?F[k]/bulk:F[k]);
  let flS;const sweet=!!(match&&match.sweet);
  if(!bulk){flS=.15;if(n)notes.push('冇主料，淨係食調味');}
  else{
    const key=sweet?'t':'s',lo=sweet?.6:.35,hi=sweet?2.4:1.5,v=D[key];let base;
    if(v<lo){base=1-(lo-v)/lo*.85;notes.push(sweet?'唔夠甜':'淡口');}
    else if(v>hi){base=Math.max(0,1-(v-hi)/hi*1.3);notes.push(sweet?'甜到漏':'鹹到痺');}
    else base=1;
    if(hp==='mum'&&base<1)base=1-(1-base)/2;
    let f=base*.72+Math.min(1,D.u)*.14+Math.min(1,D.x)*.14;
    if(!sweet&&D.t>1.4){f-=.15;notes.push('偏甜');}
    if(D.a>1.1){f-=.12;notes.push('好酸');}
    if(D.h>1.6){f-=.12;notes.push('辣到噴火');}
    if(D.f>2){f-=.12;notes.push('好油膩');}
    if(D.u>=.8)notes.push('夠鮮');
    if(D.x>=.9)notes.push('好香');
    flS=clamp(f,0,1);
  }
  // 配搭
  let comboS;
  if(match){
    const oh=match.opt.filter(x=>ids.has(x)).length;
    comboS=match.opt.length?Math.min(1,.65+.35*Math.min(1,oh/Math.min(3,match.opt.length))):1;
    const extra=[...ids].filter(x=>!match.req.includes(x)&&!match.opt.includes(x)&&!['oil','salt','sugar','water'].includes(x)).length;
    if(extra>2){comboS-=.05*(extra-2);notes.push('加咗唔少私人創作');}
  }else{
    const cats=new Set(items.map(i=>i.g.c));
    let c=.25;if(cats.has('meat')||cats.has('sea')||cats.has('egg'))c+=.25;if(cats.has('veg'))c+=.15;if(cats.has('aro'))c+=.1;if(cats.has('starch'))c+=.05;
    let pr=0;PAIRS.forEach(([a,b])=>{if(ids.has(a)&&ids.has(b))pr++});c+=Math.min(.25,pr*.1);
    if(pr)notes.push('配搭合拍');
    let cl=0;CLASH.forEach(([a,b])=>{if(ids.has(a)&&ids.has(b))cl++});
    if(cl){c-=.2*cl;notes.push('撞味');}
    if(ids.size>9){c-=.05*(ids.size-9);notes.push('大雜燴');}
    comboS=clamp(c,.05,.85);
    if(chosen){const miss=chosen.req.filter(x=>!ids.has(x)).map(x=>ING[x].n);
      if(miss.length)notes.push('未夠料煮「'+chosen.n+'」：欠'+miss.join('、'));
      else if(chosen.m!==mk)notes.push('「'+chosen.n+'」要用'+METH[chosen.m].n);}
  }
  // 廚具
  const fit=w.fit[mk]||0;let toolS=fit;
  if(match){if(!match.w.includes(wk))toolS*=.9;if(mk!=='raw'&&Math.abs(heat-match.h)>2){toolS-=.15;notes.push('火候同食譜差好遠');}}
  toolS=clamp(toolS-toolPen,0,1);
  if(fit<.3&&n)add(`用${w.n}嚟${m.n}，有啲勉強`,'bad',0);
  // 食材品質
  const qi=items.filter(i=>i.g.c!=='sau');
  const avgQ=qi.length?avg(qi.map(i=>i.q)):1;
  const qualS=clamp((avgQ-.6)/.65,0,1);
  // 加減分
  const firstSolid=items.find(i=>i.g.c!=='oil');
  if((mk==='stir'||mk==='pan')&&hasOil&&firstSolid&&firstSolid.g.c==='aro'){bonus+=3;add('先爆香，香氣四溢','good',firstSolid.ti);}
  if(mk==='stir'&&wk==='wok'&&heat>=8&&n){const b=hp==='wokmaster'?8:5;bonus+=b;add('猛火快炒，鑊氣十足','good',T*.6);}
  if(lv>1)bonus+=Math.min(8,lv-1);
  if(hp==='bro')bonus+=2;
  if(hp==='auntie'&&match){bonus+=6;add('王太傳授秘方','good',T*.5);}
  if(hp==='barista')bonus+=2;
  if(hp==='chef'){bonus+=8;add('主廚親自擺盤','good',T);}
  if(hp==='somm'&&(ids.has('redwine')||ids.has('whitewine'))){bonus+=3;add('侍酒師揀咗支啱嘅酒入饌','good',T*.5);}
  if(sk==='cha'&&mk!=='raw'&&n){const te=T*(hp==='sister'?.7:1);if(te<=m.t[2]){bonus+=4;add('快靚正，出餐神速','good',T);}else if(te>m.t[2]*2){bonus-=6;add('客人等到嬲','bad',T);}}
  if(sk==='french'&&hp!=='chef'&&n){bonus-=5;add('冇主廚睇住，擺盤求其','bad',T);}
  if(mk==='grill'&&wk==='campfire'&&n){bonus+=3;add('炭火香','good',T*.5);}
  if(hp==='roomie'&&R()<.3){bonus-=6;add('阿B 趁你唔覺意食咗一大啖','bad',T);}
  const ow=m.ow;
  const W={done:30+7.5*(1-ow),order:15*ow,flavor:20+7.5*(1-ow),combo:15,tool:10,qual:10};
  let score=doneS*W.done+orderS*W.order+flS*W.flavor+comboS*W.combo+toolS*W.tool+qualS*W.qual+bonus;
  score=Math.round(clamp(score,0,100));
  if(!bulk)score=Math.min(score,20);
  if(!n)score=0;
  const gr=GRADES.find(g=>score>=g[0]);
  // 名
  const burnt=cooked.filter(i=>i.d.c==='burnt').length,rawN=cooked.filter(i=>i.d.c==='raw').length;
  let name=match?match.n:nameDish(items,mk);
  if(cooked.length&&burnt/cooked.length>.5)name='焦炭'+name;
  else if(cooked.length&&rawN/cooked.length>.5&&mk!=='raw')name='半生熟'+name;
  if(gr[1]==='E'&&match)name='失敗嘅'+match.n;
  const cost=S.pot.reduce((a,p)=>a+p.price,0);
  const group=gr[1]==='S'||gr[1]==='A'?'good':gr[1]==='B'||gr[1]==='C'?'mid':'bad';
  let comment=pick(sc.cm[group]).replace('{d}',name);
  if(sk==='steak'&&steakMiss&&rand)comment=`客人：「我要${S.order}熟，呢塊唔係喎。」`;
  return{score,grade:gr[1],gname:gr[2],gcol:gr[3],name,match,items,events:ev,notes,cost,danger,poison,confiscated,healthHit,fameHit,T,Teff,heat,
    comps:{done:doneS,order:orderS,flavor:flS,combo:comboS,tool:toolS,qual:qualS},W,D,bulk,comment,ware:w.n,method:m.n};
}
const SHORT={rice:'飯',noodle:'麵',hofun:'河',ricenoodle:'米粉',spaghetti:'意粉',macaroni:'通粉'};
function nameDish(items,mk){
  if(!items.length)return'空氣';
  const qty={};items.forEach(i=>qty[i.id]=(qty[i.id]||0)+1);
  const uniq=[];items.forEach(i=>{if(!uniq.find(u=>u.id===i.id))uniq.push(i)});
  const by=c=>uniq.filter(i=>c.includes(i.g.c)).sort((a,b)=>qty[b.id]-qty[a.id]);
  const prot=by(['meat','sea']),eggs=by(['egg']),vegs=by(['veg']),starch=by(['starch']);
  const solids=prot.concat(eggs,vegs,starch);
  if(!solids.length){const l=uniq.find(i=>i.g.c==='liq');return l?'清'+l.g.n:uniq[0].g.n+'汁';}
  const tagI=uniq.find(i=>i.g.tag&&i.g.c==='sau')||uniq.find(i=>i.g.tag&&i.g.c==='liq')||uniq.find(i=>i.g.tag);
  const tag=tagI?tagI.g.tag:'';
  const sI=starch.find(i=>SHORT[i.id]);
  const main=prot[0]||eggs[0]||vegs[0]||starch[0];
  const second=solids.find(i=>i!==main&&i!==sI&&i.g.c!=='meat'&&i.g.c!=='sea')||solids.find(i=>i!==main&&i!==sI);
  if(sI&&main!==sI&&(mk==='stir'||mk==='boil'||mk==='bake')){
    if(mk==='stir')return`${tag}${main.g.n}炒${SHORT[sI.id]}`;
    if(mk==='boil')return`${tag}${main.g.n}${sI.g.n}`;
    return`焗${tag}${main.g.n}${SHORT[sI.id]}`;
  }
  const mn=main.g.n,sn=second?second.g.n:'';
  switch(mk){
    case'stir':return sn?`${sn}炒${mn}`:`${tag||'清'}炒${mn}`;
    case'pan':return`${tag||'香'}煎${mn}`;
    case'fry':return`${tag||'酥'}炸${mn}`;
    case'boil':return items.some(i=>i.id==='water'||i.id==='stock')&&!tag?`${mn}${sn}湯`:`${tag||'清'}煮${mn}`;
    case'braise':return sn?`${sn}炆${mn}`:`${tag||'紅'}炆${mn}`;
    case'steam':return`${tag||'清'}蒸${mn}`;
    case'bake':return`${tag}焗${mn}`;
    case'grill':return`${tag||'炭'}燒${mn}`;
    default:return`涼拌${mn}`;
  }
}

      if(S.health<=2){toast('冇力喇，休息下先');return}

function timeline(res){
  const L=[];const verb={oil:'落{n}，熱{w}',aro:'落{n}，「嗞——」爆香',meat:'落{n}，滋滋聲',sea:'落{n}',egg:'落{n}',veg:'落{n}，兜勻',starch:'落{n}',liq:'注入{n}',sau:'加{n}'};
  res.items.forEach(it=>L.push({tm:it.ti||0,t:(verb[it.g.c]||'落{n}').replace('{n}',it.g.n).replace('{w}',res.ware),k:''}));
  res.events.forEach(e=>L.push({tm:e.tm==null?res.T*.5:e.tm,t:e.t,k:e.k}));

  L.push({tm:res.Teff,t:res.confiscated?'……':(res.method==='涼拌'?'拌勻上碟':'熄火，上碟'),k:''});

}

  if(!res.confiscated){
    const c=S.codex[res.name];
    if(!c||res.score>c.s)S.codex[res.name]={s:res.score,g:res.grade,sc:S.scene,r:res.match?res.match.id:'',n:(c?c.n:0)+1};else c.n++;
  }
  const L0=level();S.exp+=res.confiscated?2:Math.round(res.score/6)+(res.match?3:0);const L1=level();
  if(L1>L0)msgs.push(`廚藝升到 Lv${L1}！`);
  nextMeal();checkHealth(msgs);
  CUR=null;save();closeSheet();renderAll();toast(msgs.join(' '));
}
function openSheet(html){$('#sheet').innerHTML=html;$('#ov').hidden=false;const b=$('#sheet .btn');if(b)b.focus({preventScroll:true});}
function closeSheet(){$('#ov').hidden=true;$('#sheet').innerHTML='';}
function showCodex(){
  const secs=SKEYS.map(k=>{const rs=RECIPES.filter(r=>r.s===k);
    const known=rs.map(r=>{const c=S.codex[r.n];return c?`<div class="cx"><span>${r.n}</span><b>${c.g}</b></div>`:`<div class="cx unk"><span>？？？</span><span>${METH[r.m].n}</span></div>`}).join('');
    const own=Object.entries(S.codex).filter(([n,c])=>c.sc===k&&!c.r).sort((a,b)=>b[1].s-a[1].s).slice(0,8).map(([n,c])=>`<div class="cx"><span>${esc(n)}</span><b>${c.g}</b></div>`).join('');
    return`<div class="codex-sec" style="--sc:${SCOL[k]}"><h4>${SC[k].n}</h4><div class="codex-list">${known}${own}</div></div>`}).join('');
  const total=RECIPES.length,got=RECIPES.filter(r=>S.codex[r.n]).length,own=Object.values(S.codex).filter(c=>!c.r).length;
  openSheet(`<h3>食譜圖鑑</h3><p class="src-desc">食譜 ${got}/${total} · 自創料理 ${own} 款。問號嘅食譜可以喺灶台嘅食譜選單度睇提示。</p>${secs}
  <div class="res-acts"><button class="btn" data-act="close">關閉</button></div>`);
}
let resetArmed=false,resetTimer;
function reset(){
  const b=$('#btnReset');
  if(!resetArmed){resetArmed=true;b.textContent='再撳一下確認';b.classList.add('warn');resetTimer=setTimeout(()=>{resetArmed=false;b.textContent='重新開始';b.classList.remove('warn')},3500);return}
  clearTimeout(resetTimer);resetArmed=false;b.textContent='重新開始';b.classList.remove('warn');
  S=newState();restock();save();renderAll();toast('重新開始，第一日');
}

function init(){
  S=load()||newState();
  if(!Object.keys(S.stock).length)restock();
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act,v=b.dataset.v,se=sel();
    switch(a){
      case'scene':switchScene(v);break;
      case'src':S.src[S.scene]=v;save();renderPantry();break;
      case'add':addItem(v);break;
      case'rm':removeItem(+v);break;
      case'up':{const i=+v;[S.pot[i-1],S.pot[i]]=[S.pot[i],S.pot[i-1]];save();renderPot();break}
      case'dn':{const i=+v;[S.pot[i+1],S.pot[i]]=[S.pot[i],S.pot[i+1]];save();renderPot();break}
      case'method':setMethod(v);save();renderSetup();renderPot();break;
      case'ware':se.ware=v;se.heat=Math.min(se.heat,wareCap(S.scene,v))||1;save();renderSetup();renderPot();break;
      case'helper':se.helper=v;save();renderSetup();renderPantry();renderPot();break;
      case'follow':follow();break;
      case'clear':clearPot();break;
      case'cook':cook();break;
      case'skip':clearInterval(animTimer);clearTimeout(animTimer);showResult(CUR);break;
      case'eat':case'serve':case'photo':case'toss':resolve(a);break;
      case'work':work();break;
      case'codex':showCodex();break;
      case'close':closeSheet();break;
      case'reset':reset();break;
    }
  });
  document.addEventListener('change',e=>{if(e.target.id==='selRecipe'){sel().recipe=e.target.value;save();renderSetup();renderPot();}});
  document.addEventListener('input',e=>{
    const se=sel();
    if(e.target.id==='heat'){se.heat=+e.target.value;$('#heatV').textContent=se.heat+' / '+wareCap(S.scene,se.ware);$('#flames').innerHTML=flames(se.heat);save();renderPot();}
    if(e.target.id==='time'){se.time=+e.target.value;$('#timeV').textContent=fmtT(se.time);save();renderPot();}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden&&!CUR)closeSheet();});
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!CUR)closeSheet();});
  renderAll();
}
if(!globalThis.NODE_TEST)init();
</script>
